name: Terraform Azure Deployment

on:
  push:
    branches:
      - main

# Required for OIDC if you switch to that later, but good practice now
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    # Define environment variables at the job level so all steps can see them
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # This step is technically optional if you use the ARM_ variables above,
    # but it's fine to keep for other Azure CLI tasks.
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform Init
      run: terraform init
      working-directory: VMdeploy

    - name: Terraform Plan
      run: terraform plan
      working-directory: VMdeploy

    - name: Terraform Apply
      run: terraform apply -auto-approve
      working-directory: VMdeploy
